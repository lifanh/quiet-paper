# Publish @lifanh/quiet-paper when a GitHub Release is published.
# Tag: v0.1.0 must match package.json version (without v).

name: Release — publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        run: npm ci && npm run build

      - name: Verify version matches release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG=$(node -p "require('./package.json').version")
          EXPECTED="${TAG#v}"
          if [ "$PKG" != "$EXPECTED" ]; then
            echo "package.json version ($PKG) must match release tag ($TAG → $EXPECTED)"
            exit 1
          fi

      - name: Publish to npm (provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}